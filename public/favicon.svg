<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 深蓝色圆形背景 -->
  <circle cx="64" cy="64" r="64" fill="#1a2a6c"/>
  
  <!-- 内部装饰圆环 -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(79, 172, 254, 0.2)" stroke-width="2"/>
  
  <!-- 网络节点（左下和右上） -->
  <circle cx="28" cy="28" r="7" fill="#4facfe" opacity="0.7"/>
  <circle cx="100" cy="100" r="7" fill="#4facfe" opacity="0.7"/>
  
  <!-- 连接线（隧道） -->
  <g stroke="#4facfe" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6">
    <line x1="28" y1="28" x2="100" y2="100" />
  </g>
  
  <!-- 字母 KT（粗体，白色，居中） -->
  <text x="64" y="64" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">
    KT
  </text>
  
  <!-- 小字 GUI（极浅蓝色，字号缩小，位于 KT 右下侧） -->
  <text x="90" y="98" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#d8ecf5" text-anchor="middle" dominant-baseline="central">
    GUI
  </text>
  
  <!-- 连接箭头（左上角） -->
  <g transform="translate(16, 16)" fill="none" stroke="#d8ecf5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <path d="M 0,12 L 12,0" />
    <path d="M 7,0 L 12,0 L 12,5" />
  </g>
</svg>